name: Publish Desktop App

# 打 tag (v*) 时触发，与 publish-pypi.yml 并行。
# 构建 macOS (aarch64 + x86_64) 和 Windows 的 Tauri 桌面应用，
# 打包后上传到 GitHub Release。
#
# 跳过条件：自上一个 tag 以来 desktop/ 或 pyproject.toml 没有改动时，
# 跳过 3 平台构建（用 check-changes job 输出 desktop-changed 控制 build）。

on:
  push:
    tags:
      - 'v*'
  # 允许手动触发 mirror-updater-json 来重新部署 Pages（不需要发新版本）。
  # 触发时只需指定 tag（如 v0.5.99），会触发 deploy-docs 从该 release 拉 latest.json 部署到 Pages。
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to redeploy latest.json from (e.g. v0.5.99)'
        required: true
        type: string

jobs:
  # 检查自上一个 tag 以来 desktop 相关文件是否变化
  check-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      desktop-changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect desktop changes since previous tag
        id: diff
        run: |
          # 找当前 tag 之前最近的 v* tag
          CURRENT="${GITHUB_REF_NAME}"
          PREVIOUS=$(git tag --list 'v*' --sort=-creatordate | grep -v "^${CURRENT}$" | head -1)
          if [ -z "$PREVIOUS" ]; then
            # 没有前一个 tag（首次 release），必须构建
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "No previous tag found, will build"
            exit 0
          fi
          echo "Comparing $PREVIOUS → $CURRENT"
          # desktop/ 整个目录 + packages/shared/（共享组件）+ pyproject.toml（版本号需要同步进 bundle）
          DIFF=$(git diff --name-only "$PREVIOUS".."$CURRENT" -- desktop/ packages/shared/ pyproject.toml)
          if [ -z "$DIFF" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No desktop-related changes, will skip build"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Desktop changes detected:"
            echo "$DIFF"
          fi

  build:
    needs: check-changes
    if: github.event_name == 'push' && needs.check-changes.outputs.desktop-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 已于 2026-11-02 退役（GitHub 官方 changelog），
          # 继续使用会让 job 在 1 秒内被取消：
          #   "The configuration 'macos-14-arm64-us-default' is not supported"
          # 后果是 macOS 产物根本没被打包，latest.json 里只剩 Windows 条目，
          # 桌面端自动更新报 "None of the fallback platforms were found"。
          - platform: macos-15
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-15
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # 只打 NSIS（.exe），不打 MSI。
            #
            # 原因：Windows MSI 的版本号约束比 semver 更严——预发布标识必须纯数字
            # （`1.0.0-beta.2` 里的 `beta` 直接报错 "optional pre-release identifier
            # in app version must be numeric-only"）。而我们给 macOS 用的标准 semver
            # 含文字后缀，两者无法共用同一个版本字符串。
            #
            # 既然 updater 本来就优先用 NSIS（见下面 updaterJsonPreferNsis），
            # 直接不产 MSI 更简单：NSIS 对版本号格式没有这个限制。
            # 用户拿到的 Windows 安装包一直是 .exe，去掉 MSI 不影响现有用户。
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: pnpm install --frozen-lockfile

      - name: Sync version from pyproject.toml
        # Windows runner 默认用 PowerShell，但脚本里是 bash 语法（$(...)、${...}），
        # 必须显式指定 bash（Windows 自带 Git Bash）。
        # 同时避免用 sed——BSD sed (macOS) 不支持 0,/pattern/ 范围语法，
        # 会报 "extra characters at the end of d command" 导致 macOS 构建失败。
        shell: bash
        run: |
          # pyproject.toml 是唯一版本源，构建前把版本号同步到 desktop 各文件
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          # PEP 440 → semver：Tauri 只认 semver，不认 `1.0.0b1` 这种写法
          # （报错 `tauri.conf.json > version must be a semver string`）。
          #   1.0.0b1  → 1.0.0-beta.1
          #   1.0.0a2  → 1.0.0-alpha.2
          #   1.0.0rc1 → 1.0.0-rc.1
          # 无预发布后缀的正式版原样保留。
          # PEP 440 → 标准 semver（Tauri 只认 semver，不认 `1.0.0b2`）
          #   1.0.0b2  → 1.0.0-beta.2
          #   1.0.0a1  → 1.0.0-alpha.1
          #   1.0.0rc3 → 1.0.0-rc.3
          #   1.0.0    → 1.0.0
          SEMVER=$(python3 -c "
          import re, sys
          v = '$VERSION'
          m = re.match(r'^(\d+\.\d+\.\d+)(?:(a|b|rc)(\d+))?$', v)
          if not m:
              print(v); sys.exit()
          base, tag, num = m.group(1), m.group(2), m.group(3)
          if not tag:
              print(base)
          else:
              full = {'a': 'alpha', 'b': 'beta', 'rc': 'rc'}[tag]
              print(f'{base}-{full}.{num}')
          ")
          echo "PEP440 $VERSION → semver $SEMVER for desktop files"
          # Windows MSI 只接受纯数字的预发布标识（不能有 beta/alpha 字样），
          # 报错：optional pre-release identifier must be numeric-only。
          # 所以 Windows 单独算一个 4 段式版本（见下面的 Override 步骤）。
          # tauri.conf.json / package.json / Cargo.toml 统一用 Python 跨平台处理
          python3 -c "
          import json, re
          version = '$SEMVER'
          # Windows 默认 cp1252，读不了 UTF-8 中文注释（Cargo.toml 等），必须显式 utf-8
          # tauri.conf.json
          f = 'desktop/src-tauri/tauri.conf.json'
          d = json.load(open(f, encoding='utf-8'))
          d['version'] = version
          with open(f, 'w', encoding='utf-8') as fh:
              json.dump(d, fh, indent=2, ensure_ascii=False)
              fh.write('\n')
          # package.json
          f = 'desktop/package.json'
          d = json.load(open(f, encoding='utf-8'))
          d['version'] = version
          with open(f, 'w', encoding='utf-8') as fh:
              json.dump(d, fh, indent=2, ensure_ascii=False)
              fh.write('\n')
          # Cargo.toml：只替换 [package] 下第一行 version（首个出现的 version = \"...\")
          f = 'desktop/src-tauri/Cargo.toml'
          content = open(f, encoding='utf-8').read()
          content = re.sub(r'^version = \".*?\"', f'version = \"{version}\"', content, count=1, flags=re.MULTILINE)
          open(f, 'w', encoding='utf-8').write(content)
          print('Verified:', [l for l in content.splitlines() if l.startswith('version')][:1])
          "

      # 构建失败自动重试一次。
      #
      # 实测踩到：macOS arm64 因为 GitHub API 瞬时超时（Connect Timeout Error
      # api.github.com:443）失败，导致 release 里只有 x64 产物、latest.json 缺
      # darwin-aarch64 条目，Apple Silicon 用户检测更新时报
      # "None of the fallback platforms [darwin-aarch64-app, darwin-aarch64] were found"。
      #
      # 这类网络抖动重试一次基本就好。用 continue-on-error + 判断 outcome 实现，
      # 因为 composite action 本身不支持 retry。
      - name: Build Tauri app
        id: build1
        continue-on-error: true
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名私钥（生成 .sig 文件 + latest.json 必需）
          # 在仓库 Settings → Secrets 里添加 TAURI_SIGNING_PRIVATE_KEY
          # 本地生成命令：pnpm --dir desktop tauri signer generate -w ~/.tauri/ethan-updater.key
          # 私钥保密，公钥贴进 desktop/src-tauri/tauri.conf.json 的 plugins.updater.pubkey
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 若私钥设了密码，再加这个 secret；无密码可省略
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Ethan Agent ${{ github.ref_name }}'
          releaseBody: '桌面端应用，下载对应平台的安装包即可使用。'
          releaseDraft: false
          prerelease: false
          # 不在各平台并行 build 里上传 latest.json：先编完的平台会把只有自己一家的
          # 半成品 latest.json 挂到已发布的 Release 上，导致其他平台用户在构建窗口期
          # 检查更新报 "None of the fallback platforms ... were found"。统一交给下游
          # fix-updater-json 在三平台全部上传完 .sig 和安装包后再一次性合成发布。
          uploadUpdaterJson: false
          # Windows 用 NSIS（生成 .exe）而非 .msi，便于 updater 静默安装
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # 第一次失败时重试一次（原因见上：网络抖动）
      - name: Build Tauri app (retry)
        id: build2
        if: steps.build1.outcome == 'failure'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Ethan Agent ${{ github.ref_name }}'
          releaseBody: '桌面端应用，下载对应平台的安装包即可使用。'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # 两次都失败才真的失败
      - name: Fail if both build attempts failed
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure'
        run: |
          echo "::error::Tauri build failed twice (first attempt and retry)"
          exit 1

      - name: Upload artifacts (macOS)
        if: matrix.platform != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ethan-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ethan-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe

  # 当 desktop 文件没有变动、build 被跳过时，把前一个 release 的 latest.json
  # 搬到当前 release，确保 updater endpoint 始终可用。
  carry-updater-json:
    needs: check-changes
    if: github.event_name == 'push' && needs.check-changes.outputs.desktop-changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copy latest.json from previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 找当前 tag 之前最近的含 latest.json 的 release。
          # 先整段捕获再取首行——若直接 `gh ... | head -1`，head 提前关闭管道会让 gh 收到
          # EPIPE 返回非零，在默认的 `bash -eo pipefail` 下会中断整个步骤。
          # gh release list --json 不支持 assets 字段，走 REST API（响应原生含 assets 数组）
          RELEASES=$(gh api "repos/$REPO/releases?per_page=30" \
            -q '.[] | select(.assets[]?.name == "latest.json") | .tag_name')
          PREVIOUS=$(printf '%s\n' "$RELEASES" | head -1)
          if [ -z "$PREVIOUS" ]; then
            echo "No previous release with latest.json found, skipping."
            exit 0
          fi
          echo "Copying latest.json from release $PREVIOUS"
          gh release download "$PREVIOUS" --repo "$REPO" --pattern "latest.json" --dir /tmp
          # 等待当前 release 被 docker workflow 创建。docker 用 QEMU 跑 arm64 多架构构建，
          # 慢时要 10-20+ 分钟，等待预算必须显著大于它——最多等 30 分钟（90 次 × 20s）。
          RELEASE_READY=false
          for i in $(seq 1 90); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              RELEASE_READY=true
              break
            fi
            echo "Waiting for release $TAG to be created... ($i/90)"
            sleep 20
          done
          if [ "$RELEASE_READY" != "true" ]; then
            # release 迟迟没出现：不要往不存在的 release 上传（会硬失败）。
            # 报错退出让这次 carry 可见地失败，而非静默产出一个没有 latest.json 的 release。
            echo "::error::Release $TAG was not created within 30min; cannot carry latest.json." >&2
            exit 1
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber /tmp/latest.json

  # 把 release 上 latest.json 里的下载地址从 GitHub API 形式
  # （api.github.com/.../releases/assets/<id>）改写为 CDN 直链
  # （github.com/.../releases/download/<tag>/<filename>）。
  # 原因：API 地址受未认证限流（60 次/小时/IP）且对网络环境敏感，桌面端
  # updater 下载安装包时经常拿到 403 Forbidden；直链走 CDN 分发无限流。
  # tauri-action 生成的 latest.json 里 URL 是 asset API 地址、不含文件名，
  # 需要反查 release assets 建立 id→filename 映射后再替换。
  fix-updater-json:
    needs: [build, carry-updater-json]
    # workflow_dispatch 时 build/carry 都跳过，需要显式放行（手动修历史 release 用）
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success' || needs.carry-updater-json.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build or rewrite latest.json with CDN direct links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import datetime, json, os, re, subprocess, time

          repo = os.environ["REPO"]
          tag = os.environ["TAG"]

          def pep440_to_semver(raw: str) -> str:
              v = raw.lstrip("v")
              m = re.match(r'^(\d+\.\d+\.\d+)(?:(a|b|rc)(\d+))?$', v)
              if not m:
                  return v
              base_ver, pre_tag, pre_num = m.group(1), m.group(2), m.group(3)
              if not pre_tag:
                  return base_ver
              full = {"a": "alpha", "b": "beta", "rc": "rc"}[pre_tag]
              return f"{base_ver}-{full}.{pre_num}"

          # 1. 反查 asset id -> 文件名（含各平台打包上传的安装包与 .sig）
          #    release 可能由 docker workflow 后创建，先等它出现
          release = None
          for i in range(90):
              r = subprocess.run(
                  ["gh", "api", f"repos/{repo}/releases/tags/{tag}"],
                  capture_output=True, text=True,
              )
              if r.returncode == 0:
                  release = json.loads(r.stdout)
                  break
              print(f"Waiting for release {tag}... ({i+1}/90)")
              time.sleep(20)
          assert release, f"release {tag} not found"
          id2name = {str(a["id"]): a["name"] for a in release["assets"]}
          print("asset map:", json.dumps(id2name, indent=2))

          # 2. 若 release 上已有 latest.json（carry-updater-json 搬运或手动修历史 release），
          #    先下载下来；正常多平台 build 因 uploadUpdaterJson=false 尚未上传 latest.json，
          #    此时从头合成一份完整清单再一次性上传，避免并行构建窗口期暴露半成品。
          os.makedirs("/tmp/fixjson/sig", exist_ok=True)
          base = f"https://github.com/{repo}/releases/download/{tag}"
          dl = subprocess.run(
              ["gh", "release", "download", tag, "--repo", repo,
               "--pattern", "latest.json", "--dir", "/tmp/fixjson", "--clobber"],
              capture_output=True, text=True,
          )
          changed = 0
          if dl.returncode == 0:
              with open("/tmp/fixjson/latest.json", encoding="utf-8") as f:
                  data = json.load(f)
          else:
              data = {
                  "version": pep440_to_semver(tag),
                  "notes": "桌面端应用，下载对应平台的安装包即可使用。",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": {},
              }
              changed += 1

          # 3. 把 api.github.com 的 asset 地址替换为直链；无法映射的保持原样
          for plat, info in data.get("platforms", {}).items():
              url = info.get("url", "")
              if "api.github.com" in url:
                  asset_id = url.rstrip("/").rsplit("/", 1)[-1]
                  name = id2name.get(asset_id)
                  if name:
                      info["url"] = f"{base}/{name}"
                      changed += 1
                      print(f"{plat}: {asset_id} -> {name}")
                  else:
                      print(f"WARNING: {plat}: asset id {asset_id} not in release, left as-is")

          # 3.5 从 release assets 补全/构建全平台条目：
          #     并行矩阵关闭 uploadUpdaterJson 后，三平台各自只上传安装包与 .sig，
          #     由此处一次性拼出完整 latest.json；也能兜底历史残缺 release。
          _PLATFORM_SUFFIXES = {
              "darwin-aarch64": "_aarch64.app.tar.gz",
              "darwin-aarch64-app": "_aarch64.app.tar.gz",
              "darwin-x86_64": "_x64.app.tar.gz",
              "darwin-x86_64-app": "_x64.app.tar.gz",
              "windows-x86_64": "-setup.exe",
              "windows-x86_64-nsis": "-setup.exe",
          }
          _sig_cache: dict[str, dict[str, str] | None] = {}

          def rebuild_platform(key: str):
              """从 release assets 里构建某个平台条目。返回 dict 或 None。"""
              suffix = _PLATFORM_SUFFIXES.get(key)
              if not suffix:
                  return None
              if suffix in _sig_cache:
                  return dict(_sig_cache[suffix]) if _sig_cache[suffix] else None
              asset = next(
                  (a for a in release["assets"] if a["name"].endswith(suffix)),
                  None,
              )
              if not asset:
                  _sig_cache[suffix] = None
                  return None
              sig_name = asset["name"] + ".sig"
              sig = subprocess.run(
                  ["gh", "release", "download", tag, "--repo", repo,
                   "--pattern", sig_name, "--dir", "/tmp/fixjson/sig", "--clobber"],
                  capture_output=True, text=True,
              )
              sig_path = f"/tmp/fixjson/sig/{sig_name}"
              if sig.returncode != 0 or not os.path.exists(sig_path):
                  _sig_cache[suffix] = None
                  return None
              with open(sig_path, encoding="utf-8") as fh:
                  signature = fh.read().strip()
              entry = {
                  "signature": signature,
                  "url": f"{base}/{asset['name']}",
              }
              _sig_cache[suffix] = entry
              return dict(entry)

          platforms = data.setdefault("platforms", {})
          built = []
          for key in _PLATFORM_SUFFIXES:
              if key in platforms:
                  continue
              rebuilt = rebuild_platform(key)
              if rebuilt:
                  platforms[key] = rebuilt
                  built.append(key)
          if built:
              print(f"构建/补全了平台条目: {built}")
              changed += len(built)

          REQUIRED = [
              "darwin-aarch64",
              "darwin-aarch64-app",
              "darwin-x86_64",
              "darwin-x86_64-app",
              "windows-x86_64",
              "windows-x86_64-nsis",
          ]
          missing = [pname for pname in REQUIRED if pname not in platforms]
          if missing:
              print(f"::error::latest.json 缺少平台 {missing}；"
                    f"实际只有 {sorted(platforms)}，且无法从 release assets 重建。"
                    "很可能是对应 runner 的 build job 失败/被取消。"
                    "拒绝发布残缺的更新清单。")
              raise SystemExit(1)
          print(f"平台完整性 OK: {sorted(platforms)}")

          if changed == 0:
              print("All URLs already direct links, skipping upload")
              raise SystemExit(0)

          with open("/tmp/fixjson/latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          # 4. 覆盖上传回 release
          subprocess.run(
              ["gh", "release", "upload", tag, "--repo", repo,
               "--clobber", "/tmp/fixjson/latest.json"],
              check=True,
          )
          print(f"Built/rewrote {changed} entries with direct links and uploaded")
          PYEOF

      # 发布后校验：latest.json 必须同时覆盖 Apple Silicon 和 Intel。
      #
      # 实测踩到：macOS arm64 构建因网络超时失败，release 里只有 x64 产物，
      # latest.json 的 platforms 缺 darwin-aarch64 → M 系列 Mac 检测更新时报
      #   "None of the fallback platforms [darwin-aarch64-app, darwin-aarch64]
      #    were found in the response platforms object"
      # 而 workflow 本身是"部分成功"，没人会注意。这个校验让它显性失败。
      - name: Verify latest.json covers all macOS arches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          repo, tag = os.environ["REPO"], os.environ["TAG"]
          r = subprocess.run(
              ["gh", "api", f"repos/{repo}/releases/tags/{tag}"],
              capture_output=True, text=True,
          )
          if r.returncode != 0:
              print(f"::warning::取不到 release {tag}，跳过校验")
              sys.exit(0)

          assets = json.loads(r.stdout).get("assets", [])
          lj = next((a for a in assets if a["name"] == "latest.json"), None)
          if not lj:
              print("::warning::release 里没有 latest.json，跳过校验")
              sys.exit(0)

          dl = subprocess.run(
              ["gh", "api", f"repos/{repo}/releases/assets/{lj['id']}",
               "-H", "Accept: application/octet-stream"],
              capture_output=True, text=True,
          )
          platforms = json.loads(dl.stdout).get("platforms", {})
          print(f"latest.json platforms: {sorted(platforms)}")

          # 两个 macOS 架构都必须有，否则对应机器收不到更新
          missing = []
          for arch in ("aarch64", "x86_64"):
              if not any(f"darwin-{arch}" in k for k in platforms):
                  missing.append(f"darwin-{arch}")
          # Windows 也要查 —— v1.0.0b11 就是 macOS 三个平台都在、唯独 windows 丢了，
          # 而这里当时只校验 macOS，所以没拦住。
          if not any(k.startswith("windows-") for k in platforms):
              missing.append("windows-x86_64")

          if missing:
              print(f"::error::latest.json 缺少平台 {missing}——"
                    f"对应架构的用户收不到更新。多半是那个 build job 失败了，"
                    f"去 Actions 看 build 矩阵的哪个 job 报错。")
              sys.exit(1)

          print("✅ 两个 macOS 架构都在")
          PYEOF

  # 触发 Pages 重新部署，deploy-docs 会自动从 release 拉取 latest.json。
  # 不再往 main 提交 mirror commit。
  mirror-updater-json:
    needs: [build, carry-updater-json, fix-updater-json]
    # workflow_dispatch 时 build/carry 都跳过（result 为 'skipped'），需要显式放行
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success' || needs.carry-updater-json.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Pages redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run deploy-docs.yml --repo "$REPO"
          echo "Triggered deploy-docs.yml to redeploy Pages with new latest.json"
