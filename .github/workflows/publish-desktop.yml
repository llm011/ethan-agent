name: Publish Desktop App

# 打 tag (v*) 时触发，与 publish-pypi.yml 并行。
# 构建 macOS (aarch64 + x86_64) 和 Windows 的 Tauri 桌面应用，
# 打包后上传到 GitHub Release。
#
# 跳过条件：自上一个 tag 以来 desktop/ 或 pyproject.toml 没有改动时，
# 跳过 3 平台构建（用 check-changes job 输出 desktop-changed 控制 build）。

on:
  push:
    tags:
      - 'v*'

jobs:
  # 检查自上一个 tag 以来 desktop 相关文件是否变化
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      desktop-changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect desktop changes since previous tag
        id: diff
        run: |
          # 找当前 tag 之前最近的 v* tag
          CURRENT="${GITHUB_REF_NAME}"
          PREVIOUS=$(git tag --list 'v*' --sort=-creatordate | grep -v "^${CURRENT}$" | head -1)
          if [ -z "$PREVIOUS" ]; then
            # 没有前一个 tag（首次 release），必须构建
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "No previous tag found, will build"
            exit 0
          fi
          echo "Comparing $PREVIOUS → $CURRENT"
          # desktop/ 整个目录 + packages/shared/（共享组件）+ pyproject.toml（版本号需要同步进 bundle）
          DIFF=$(git diff --name-only "$PREVIOUS".."$CURRENT" -- desktop/ packages/shared/ pyproject.toml)
          if [ -z "$DIFF" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No desktop-related changes, will skip build"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Desktop changes detected:"
            echo "$DIFF"
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.desktop-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-14
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: pnpm install --frozen-lockfile

      - name: Sync version from pyproject.toml
        # Windows runner 默认用 PowerShell，但脚本里是 bash 语法（$(...)、${...}），
        # 必须显式指定 bash（Windows 自带 Git Bash）。
        # 同时避免用 sed——BSD sed (macOS) 不支持 0,/pattern/ 范围语法，
        # 会报 "extra characters at the end of d command" 导致 macOS 构建失败。
        shell: bash
        run: |
          # pyproject.toml 是唯一版本源，构建前把版本号同步到 desktop 各文件
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Syncing desktop version files to $VERSION"
          # tauri.conf.json / package.json / Cargo.toml 统一用 Python 跨平台处理
          python3 -c "
          import json, re
          version = '$VERSION'
          # tauri.conf.json
          f = 'desktop/src-tauri/tauri.conf.json'
          d = json.load(open(f))
          d['version'] = version
          json.dump(d, open(f, 'w'), indent=2, ensure_ascii=False)
          open(f, 'a').write('\n')
          # package.json
          f = 'desktop/package.json'
          d = json.load(open(f))
          d['version'] = version
          json.dump(d, open(f, 'w'), indent=2, ensure_ascii=False)
          open(f, 'a').write('\n')
          # Cargo.toml：只替换 [package] 下第一行 version（首个出现的 version = \"...\")
          f = 'desktop/src-tauri/Cargo.toml'
          content = open(f).read()
          content = re.sub(r'^version = \".*?\"', f'version = \"{version}\"', content, count=1, flags=re.MULTILINE)
          open(f, 'w').write(content)
          print('Verified:', [l for l in content.splitlines() if l.startswith('version')][:1])
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名私钥（生成 .sig 文件 + latest.json 必需）
          # 在仓库 Settings → Secrets 里添加 TAURI_SIGNING_PRIVATE_KEY
          # 本地生成命令：pnpm --dir desktop tauri signer generate -w ~/.tauri/ethan-updater.key
          # 私钥保密，公钥贴进 desktop/src-tauri/tauri.conf.json 的 plugins.updater.pubkey
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 若私钥设了密码，再加这个 secret；无密码可省略
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Ethan Agent ${{ github.ref_name }}'
          releaseBody: '桌面端应用，下载对应平台的安装包即可使用。'
          releaseDraft: false
          prerelease: false
          # Windows 用 NSIS（生成 .exe）而非 .msi，便于 updater 静默安装
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Upload artifacts (macOS)
        if: matrix.platform != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ethan-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ethan-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe

  # 当 desktop 文件没有变动、build 被跳过时，把前一个 release 的 latest.json
  # 搬到当前 release，确保 updater endpoint 始终可用。
  carry-updater-json:
    needs: check-changes
    if: needs.check-changes.outputs.desktop-changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copy latest.json from previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 找当前 tag 之前最近的含 latest.json 的 release。
          # 先整段捕获再取首行——若直接 `gh ... | head -1`，head 提前关闭管道会让 gh 收到
          # EPIPE 返回非零，在默认的 `bash -eo pipefail` 下会中断整个步骤。
          RELEASES=$(gh release list --repo "$REPO" --limit 30 --json tagName,assets \
            -q '.[] | select(.assets[]?.name == "latest.json") | .tagName')
          PREVIOUS=$(printf '%s\n' "$RELEASES" | head -1)
          if [ -z "$PREVIOUS" ]; then
            echo "No previous release with latest.json found, skipping."
            exit 0
          fi
          echo "Copying latest.json from release $PREVIOUS"
          gh release download "$PREVIOUS" --repo "$REPO" --pattern "latest.json" --dir /tmp
          # 等待当前 release 被 docker workflow 创建。docker 用 QEMU 跑 arm64 多架构构建，
          # 慢时要 10-20+ 分钟，等待预算必须显著大于它——最多等 30 分钟（90 次 × 20s）。
          RELEASE_READY=false
          for i in $(seq 1 90); do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              RELEASE_READY=true
              break
            fi
            echo "Waiting for release $TAG to be created... ($i/90)"
            sleep 20
          done
          if [ "$RELEASE_READY" != "true" ]; then
            # release 迟迟没出现：不要往不存在的 release 上传（会硬失败）。
            # 报错退出让这次 carry 可见地失败，而非静默产出一个没有 latest.json 的 release。
            echo "::error::Release $TAG was not created within 30min; cannot carry latest.json." >&2
            exit 1
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber /tmp/latest.json

  # 把 latest.json 镜像到 GitHub Pages（web/public/latest.json），
  # 桌面端 updater 通过 Pages URL 检查更新，避免直连 GitHub Releases 在国内不稳定。
  # Pages 只用于"检查是否有新版"，实际二进制下载仍走 Releases asset URL。
  mirror-updater-json:
    needs: [build, carry-updater-json]
    if: always() && (needs.build.result == 'success' || needs.carry-updater-json.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 push 权限提交 mirror 到 main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest.json from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # build/carry 刚跑完，release 一定存在且含 latest.json
          gh release download "$TAG" --repo "$REPO" --pattern "latest.json" --dir /tmp

      - name: Commit to web/public for Pages mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p web/public
          cp /tmp/latest.json web/public/latest.json
          # 只在文件有变化时提交，避免空 commit
          if git diff --quiet web/public/latest.json; then
            echo "latest.json unchanged, skip commit"
          else
            git add web/public/latest.json
            git commit -m "chore: mirror latest.json to Pages for updater endpoint ($TAG)"
            git push
            echo "Pushed latest.json mirror, deploy-docs.yml will deploy to Pages"
          fi
