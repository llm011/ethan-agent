name: Auto-enable Squash Merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  # ⚠️ 这条触发在本仓库是死代码，实测从未派发过一次：
  # check suite 确实会 completed（github-actions app 创建的、conclusion=success），
  # 但 event=check_suite 的 workflow run 数至今为 0 —— GitHub 不让由 GITHUB_TOKEN
  # 触发的运行再触发新 workflow run（防递归）。保留它无害，但别指望它做重试。
  # 它当初是为「等检查跑完再开 auto-merge」加的，而那个假设本身就是错的根因判断，
  # 详见 docs/interface.md「PR 自动合并」。
  check_suite:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 候选 PR：三个事件来源各不相同
            let numbers = [];
            if (context.eventName === 'pull_request_target') {
              numbers = [context.payload.pull_request.number];
            } else if (context.eventName === 'check_suite') {
              // check_suite 的 pull_requests 只有数据库 id 没有 node_id，按 number 反查
              numbers = (context.payload.check_suite.pull_requests || []).map((p) => p.number);
            } else {
              const { data } = await github.rest.pulls.list({ owner, repo, state: 'open' });
              numbers = data.filter((p) => !p.draft).map((p) => p.number);
            }

            // auto-merge 只有 GraphQL 有（enablePullRequestAutoMerge mutation），
            // REST 的 github.rest.pulls 下没有 enableAutomerge —— 早先误用该方法，
            // 被 catch 吞掉后伪装成「跳过」，导致所有 PR 都开不了自动合并。
            const enable = async (number) => {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open') return `⏭️ PR #${number}: 已关闭`;
              if (pr.draft) return `⏭️ PR #${number}: draft`;
              if (pr.auto_merge) return `⏭️ PR #${number}: 已有 auto-merge`;
              try {
                const res = await github.graphql(`
                  mutation($prId: ID!) {
                    enablePullRequestAutoMerge(input: {pullRequestId: $prId, mergeMethod: SQUASH}) {
                      pullRequest { number autoMergeRequest { enabledAt } }
                    }
                  }
                `, { prId: pr.node_id });
                const enabledAt = res.enablePullRequestAutoMerge?.pullRequest?.autoMergeRequest?.enabledAt;
                return `✅ PR #${number}: auto-merge 已开启 (enabledAt=${enabledAt})`;
              } catch (e) {
                // 本仓库的 auto-merge 是**结构性开不了**的，两种拒绝都不是边缘情况：
                //   unstable status：有 check 在跑，但它们都不是 required。
                //   clean status：全绿了，已满足合并条件、无需等待。
                // enablePullRequestAutoMerge 只在 mergeStateStatus=BLOCKED（有 required
                // check 未通过）时才有意义。main 没有 required check（ruleset
                // enforcement=disabled、规则只有 deletion/non_fast_forward），PR 永远不是
                // BLOCKED，只会在 UNSTABLE ↔ CLEAN 之间摆动 —— 两条路都被拒。
                // 见 docs/interface.md「PR 自动合并」，那里有同一 PR 上的两态实测日志。
                // 另注：别指望 check_suite 事件来重试，它在本仓库不派发（见文件头）。
                // 两者都不是错误，但必须区分打印——早先把所有异常都吞成「跳过」，
                // 真正的失败（REST 方法不存在）因此藏了很久。
                const clean = /clean status/.test(e.message);
                const unstable = /unstable status/.test(e.message);
                const mark = clean || unstable ? '⏭️' : '❌';
                return `${mark} PR #${number}: ${e.message}`;
              }
            };

            if (numbers.length === 0) {
              console.log('没有需要处理的 PR');
              return;
            }
            for (const n of numbers) {
              console.log(await enable(n));
            }
