name: Auto-enable Squash Merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            // auto-merge 只有 GraphQL 有（enablePullRequestAutoMerge mutation），
            // REST 的 github.rest.pulls 下没有 enableAutomerge —— 早先误用该方法，
            // 被 catch 吞掉后伪装成「跳过」，导致所有 PR 都开不了自动合并。
            try {
              const res = await github.graphql(`
                mutation($prId: ID!) {
                  enablePullRequestAutoMerge(input: {pullRequestId: $prId, mergeMethod: SQUASH}) {
                    pullRequest { number autoMergeRequest { enabledAt } }
                  }
                }
              `, { prId: pr.node_id });
              const enabledAt = res.enablePullRequestAutoMerge?.pullRequest?.autoMergeRequest?.enabledAt;
              console.log(`✅ Auto-merge enabled for PR #${pr.number}: ${pr.title} (enabledAt=${enabledAt})`);
            } catch (e) {
              // "Pull request is in clean status"：无需 auto-merge，直接合就行
              console.log(`⏭️ Skip PR #${pr.number}: ${e.message}`);
            }

  scan-all:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            for (const pr of prs) {
              if (pr.draft) continue;
              if (pr.auto_merge) {
                console.log(`⏭️ PR #${pr.number} already has auto-merge`);
                continue;
              }
              try {
                await github.graphql(`
                  mutation($prId: ID!) {
                    enablePullRequestAutoMerge(input: {pullRequestId: $prId, mergeMethod: SQUASH}) {
                      pullRequest { number autoMergeRequest { enabledAt } }
                    }
                  }
                `, { prId: pr.node_id });
                console.log(`✅ Auto-merge enabled for PR #${pr.number}: ${pr.title}`);
              } catch (e) {
                console.log(`❌ Failed PR #${pr.number}: ${e.message}`);
              }
            }
