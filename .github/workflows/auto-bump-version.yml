name: Auto bump version on merge to main

# pyproject.toml 是唯一版本号来源。本 workflow bump pyproject.toml，并同步 uv.lock
# 里镜像的 ethan-agent 版本（见下面 uv lock 那步——只改 pyproject.toml 会让锁文件
# 长期落后）。desktop (tauri.conf.json / package.json / Cargo.toml) 和 Android
# (build.gradle.kts) 在各自构建 CI 中从 pyproject.toml 动态读取版本号，不再依赖 sed 同步。
#
# 前置条件：在仓库 Settings → Secrets 里添加名为 PAT 的 Personal Access Token
# （需要 contents: write 权限）。用 PAT 推送的 tag 才能触发 publish-pypi.yml，
# 用默认 GITHUB_TOKEN 推送的 tag 不会触发其他 workflow（GitHub 限制）。
#
# ⚠️ 与 auto-merge 的冲突（2026-10-01 实测）：**auto-merge 合并产生的 commit 不触发
# push 工作流**，本 workflow 连同 test / publish-* 全部不跑，main 停在 feat commit
# 且不产生新 tag。实测证据（同一仓库内两次合并的对照）：
#   - 自动合并的 461fc053：check suite 数 = 0，workflow run 数 = 0
#     （test.yml 无 paths 过滤、本该在每次 push main 时跑，也没跑）
#   - 手动合并的 c4b62a2c：check suite 数 = 3，各 workflow 正常
#   - 直接 git push 的 217c18ca：test.yml 正常触发
# 原因大概率是自动合并由 GITHUB_TOKEN 发起，GitHub 对 GITHUB_TOKEN 造成的事件
# 不再派发新 workflow run（防递归）——与上面 PAT 那条限制同源。
# 影响：版本号不 bump、不发版；但**代码本身已正确合入 main**，不影响正确性。
# 需要时手动补一次真实文件改动（空提交不行——本 workflow 有 paths-ignore，
# 空提交无文件变更故不匹配）或 workflow_dispatch 重跑，即可补齐版本号。
# 若要让 auto-merge 与自动发版并存，见 docs/interface.md「PR 自动合并」的取舍讨论。

on:
  push:
    branches:
      - main
    tags-ignore: ['v*']
    # bump commit 只改 pyproject.toml，无需再触发本 workflow（避免 skipped 重复 run）。
    # web/public/latest.json 由 publish-desktop 的 mirror-updater-json job 推送，
    # 也是 bot 产物，不应触发版本 bump——否则会引发二次 bump 导致 APK/Desktop 版本错位。
    paths-ignore:
      - 'pyproject.toml'
      - 'web/public/**'

jobs:
  bump:
    # 跳过 version bump 自身产生的 push，防止无限循环
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Bump patch version
        id: bump
        run: |
          OLD=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/^version = \"$OLD\"/version = \"$NEW\"/" pyproject.toml
          echo "version=$NEW" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync uv.lock to the new version
        # uv.lock 里 ethan-agent 的版本号是 pyproject.toml 的镜像，只 bump 前者会让
        # 锁文件在 main 上永久落后（历史上漂过好几版：pyproject 0.5.278 / lock 0.5.275）。
        # 必须在 bump 之后、commit 之前跑，且产物要一起提交上去。
        run: uv lock

      - name: Commit and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 显式用 PAT 配置 remote URL，避免 push 时找不到凭证
          git remote set-url origin "https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.version }}"
