name: Publish Docker Images

# 单容器镜像：ghcr.io/<owner>/ethan-agent（API + Web UI 同端口 8900）
# 镜像名与仓库同名 —— ghcr 包自动关联仓库，继承仓库可见性与协作者权限，
# 不再出现独立 ethan-web 包导致的 403。
#
# 首次发布后如拉取报 403，到 Packages → ethan-agent → Package settings
# 把可见性改为 public（只需操作一次）。
#
# 多平台构建采用 docker 官方「原生 runner + digest 分发」模式（而非 qemu 模拟）：
#   build(matrix)  各平台在原生 runner 上构建，push-by-digest 推匿名 manifest
#   merge          下载 digest，imagetools create 合并成 manifest list 并打 tag
# 原因：qemu 用户态模拟 arm64 跑 Node 20（pnpm install / next build）会触发
# Illegal instruction（exit 132，V8 JIT 代码命中 qemu 指令模拟缺陷），
# v0.5.182 挂 6h、v0.5.183 直接失败均源于此。原生 arm64 runner（公开仓库免费）
# 构建更快且无模拟层问题。

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare platform pair (linux/arm64 -> linux-arm64)
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          # 匿名 digest manifest，等 merge job 统一打 tag
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建 GitHub Release 需要 write（read 会导致 releases API 403）
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          # meta.outputs.tags 多行且自带完整镜像前缀（ghcr.io/...:latest、ghcr.io/...:0.5.x），
          # 逐行拼 -t，避免整体被当成一个参数
          TAG_ARGS=""
          for t in ${{ steps.meta.outputs.tags }}; do
            TAG_ARGS="$TAG_ARGS -t $t"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAG_ARGS \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

      # 创建/更新该 tag 的 GitHub Release：--generate-notes 自动生成 changelog，
      # 下方 notes 追加 Docker 部署说明（镜像地址 + compose 一键部署）。
      # 附件打包 deploy/ 的 compose + searxng 配置，下载解压即可启动，无需 clone 仓库。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/release-assets/searxng
          cp deploy/docker-compose.yml deploy/.env.example /tmp/release-assets/
          cp deploy/searxng/settings.yml /tmp/release-assets/searxng/settings.yml

          cat > /tmp/release-notes.md << 'EOF'
          ## 🐳 Docker 部署

          镜像（linux/amd64 + linux/arm64）：

          ```bash
          docker pull ghcr.io/REPO_PLACEHOLDER:TAG_PLACEHOLDER   # 固定版本
          docker pull ghcr.io/REPO_PLACEHOLDER:latest            # 最新版
          ```

          一键部署（下载本 Release 的 `docker-compose.yml` 与 `.env.example`，或直接用仓库 `deploy/` 目录）：

          ```bash
          cp .env.example .env    # 填入 API Key 等配置
          docker compose pull
          docker compose up -d
          docker compose logs ethan | grep 'Web UI Token'   # 查看 Web UI 登录 token
          ```

          升级：`docker compose pull && docker compose up -d`
          EOF

          sed -i "s|REPO_PLACEHOLDER|${REPO}|g; s|TAG_PLACEHOLDER|${TAG}|g" /tmp/release-notes.md

          gh release create "$TAG" \
            --repo "$REPO" \
            --generate-notes \
            --notes-file /tmp/release-notes.md \
            /tmp/release-assets/docker-compose.yml \
            /tmp/release-assets/.env.example \
            "/tmp/release-assets/searxng/settings.yml#searxng-settings.yml" \
          || gh release upload "$TAG" \
            --repo "$REPO" \
            --clobber \
            /tmp/release-assets/docker-compose.yml \
            /tmp/release-assets/.env.example \
            "/tmp/release-assets/searxng/settings.yml#searxng-settings.yml"
