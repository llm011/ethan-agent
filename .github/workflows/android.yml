name: Android Build

# 仅在 app/android/ 或本 workflow 文件本身变化时触发。
# tag (v*) 时打 release APK 上传到 Release；main push / PR 时只跑 lint + test + debug APK。
#
# 与 publish-desktop.yml 的设计思路一致：用 check-changes job 做 path filter，
# 避免无 Android 改动时浪费 CI 资源。

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'app/android/**'
      - '.github/workflows/android.yml'
      - 'pyproject.toml'  # 版本号变化影响 APK versionCode
  pull_request:
    paths:
      - 'app/android/**'
      - '.github/workflows/android.yml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  # 检查自上一个 tag 以来 app/android/ 是否变化
  # PR 触发时直接 changed=true
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      android-changed: ${{ steps.diff.outputs.changed }}
      is-release: ${{ steps.context.outputs.is-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect context
        id: context
        run: |
          # tag 或手动触发都走 release 流程（方便验证签名）
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] || [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "is-release=true" >> $GITHUB_OUTPUT
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect Android changes since previous tag
        id: diff
        run: |
          # PR 触发：直接 changed=true
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "PR trigger, will build"
            exit 0
          fi
          # workflow_dispatch 直接 changed=true
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Manual trigger, will build"
            exit 0
          fi
          # main push：直接 changed=true（paths filter 已经保证只有相关改动才触发）
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "main push with android path filter, will build"
            exit 0
          fi
          # tag 触发：和上一个 v* tag 比较
          CURRENT="${GITHUB_REF_NAME}"
          PREVIOUS=$(git tag --list 'v*' --sort=-creatordate | grep -v "^${CURRENT}$" | head -1)
          if [ -z "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "No previous tag found, will build"
            exit 0
          fi
          echo "Comparing $PREVIOUS → $CURRENT"
          DIFF=$(git diff --name-only "$PREVIOUS".."$CURRENT" -- app/android/ .github/workflows/android.yml)
          if [ -z "$DIFF" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No android-related changes, will skip build"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Android changes detected:"
            echo "$DIFF"
          fi

  build:
    needs: check-changes
    # 发版 tag 必须出包，**无条件**。
    #
    # 原来的条件是只看 `android-changed`，而 tag 触发时它是拿「上一个 tag → 当前 tag」
    # 比 app/android/ 的 diff。但发版流程是「改 pyproject.toml 版本号 + 打 tag」，
    # 根本不碰 app/android/ → changed=false → 整个 build job 被 skip → Release 上一个
    # APK 都没有。这不是边缘情况，是发版的**常态**：259✓ 260✗ 261✓ 262✗ 263✗ 264✓
    # 265✓ 266✓(碰巧有 android 改动) 267✗ 268✗ —— APK 时有时无就是这么来的。
    #
    # 连带伤害比「少个附件」更大：build 被 skip 后 sha256、R2 镜像、自建 server 的
    # 302 目标全都不会更新，客户端的三源降级一起失效（CDN 上永远是旧包）。
    #
    # android-changed 门禁只对 main push 有意义（省 CI），那里本来就走 changed=true，
    # 所以保留它不影响发版。tag 触发一律构建。
    if: startsWith(github.ref, 'refs/tags/v') || needs.check-changes.outputs.android-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tag 触发时需要写 Release

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Prepare signing keystore (release only)
        if: needs.check-changes.outputs.is-release == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing secrets found, will fall back to debug key for release"
            exit 0
          fi
          # 解码 keystore 到一个稳定路径
          mkdir -p "$HOME/.android"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/ethan-release.jks"
          # 注入到环境变量（gradle 通过 System.getenv 读取）
          echo "ANDROID_STORE_FILE=$HOME/.android/ethan-release.jks" >> $GITHUB_ENV
          echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Lint
        working-directory: ./app/android
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        working-directory: ./app/android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: ./app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        if: needs.check-changes.outputs.is-release == 'true'
        working-directory: ./app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethan-android-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: needs.check-changes.outputs.is-release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ethan-android-release
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 先算 sha256：客户端下载完会拿这个值校验，所以必须在 attach 之前生成，
      # 让 .apk 和 .apk.sha256 在同一次 release 里一起出现。
      - name: Compute APK sha256
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./app/android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          sha256sum "$APK" | awk '{print $1}' > "$APK.sha256"
          # 存绝对路径：下面 "Upload APK to R2 CDN" 要跑在仓库根目录（脚本路径是
          # 仓库根相对的），拿不到这里的 working-directory。之前这里存的是相对路径
          # `app/build/outputs/apk/release/app-release.apk`，到了那一步从仓库根解析
          # → 文件不存在 → 上传失败。存绝对路径两边都能用。
          echo "APK_PATH=${GITHUB_WORKSPACE}/app/android/$APK" >> $GITHUB_ENV
          echo "APK_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "Computed sha256 for $APK: $(cat "$APK.sha256")"

      - name: Attach release APK + sha256 to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/android/app/build/outputs/apk/release/*.apk
            app/android/app/build/outputs/apk/release/*.apk.sha256
          body: Android 客户端，下载 APK 安装即可。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 镜像到 Cloudflare R2（cdn.lyb.pub）。客户端的三源降级里这是第一顺位 ——
      # GitHub 的 release-assets 域名在国内可达性差，那正是下载失败率高的根因。
      #
      # ⚠️ 这里**故意不加** `continue-on-error`（以前加过，是个 bug）。
      #
      # 之前的注释以为「脚本非 0 退出 + continue-on-error」能把失败显式喊出来 ——
      # 实际相反：`continue-on-error: true` 会把这一步标成 **success**（只附一条
      # annotation），**不会让 job 变红**。于是 v0.5.270 那次明明报的是
      # `Error: 缺少环境变量: CDN_ENDPOINT, ...`、脚本 exit 1，整个 job 却是绿的，
      # 没人发现 CDN 上一个对象都没有。
      #
      # 顺序上也不需要这个开关：本步骤在 "Attach release APK" **之后**，GitHub Release
      # 那时已经发出去了，所以镜像失败再怎么标红也不会「拖死发版」—— 发布本身已经成功。
      # 它该起的作用只是**让别人看见少了一个源**，那就必须让 job 真的红。宁可红一次被
      # 人查到，也不要绿着少一个源。
      - name: Upload APK to R2 CDN
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CDN_ENDPOINT: ${{ secrets.CDN_ENDPOINT }}
          CDN_ACCESS_KEY: ${{ secrets.CDN_ACCESS_KEY }}
          CDN_SECRET_KEY: ${{ secrets.CDN_SECRET_KEY }}
          CDN_BUCKET: ${{ secrets.CDN_BUCKET }}
          CDN_PUBLIC_URL: ${{ secrets.CDN_PUBLIC_URL }}
          CDN_REGION: ${{ secrets.CDN_REGION }}
        run: |
          set -x
          # 先确认凭据齐了：缺 secret 时脚本会报错，但报得比较靠后；这里前置检查
          # 能让日志第一行就指出是「没配 secret」而不是「文件不存在」之类的误判。
          MISSING=""
          for v in CDN_ENDPOINT CDN_ACCESS_KEY CDN_SECRET_KEY CDN_BUCKET CDN_PUBLIC_URL; do
            if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::R2 镜像缺少 secrets:$MISSING（在 repo Settings → Secrets 里补上）"
            exit 1
          fi
          SCRIPT=ethan/defaults/skills/upload-cdn/scripts/upload_cdn.py
          PREFIX="ethan/releases/android/${APK_TAG}"
          python3 "$SCRIPT" "$APK_PATH" "$PREFIX/app-release.apk" || {
            echo "::error::R2 镜像上传失败（APK）。客户端会自动降级到自建服务端/GitHub 源，但 CDN 这个最快的源本轮不可用。"
            exit 1
          }
          python3 "$SCRIPT" "${APK_PATH}.sha256" "$PREFIX/app-release.apk.sha256" || {
            echo "::error::R2 镜像上传失败（sha256 侧车）。缺了它客户端仍能下载，只是退化成只校验长度。"
            exit 1
          }
          # 收尾自检：确认对象真的能通过公开域名取到（上传成功 ≠ CDN 上可访问）。
          for f in app-release.apk app-release.apk.sha256; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "${CDN_PUBLIC_URL:-https://cdn.lyb.pub}/$PREFIX/$f")
            if [ "$CODE" != "200" ]; then
              echo "::error::R2 对象无法通过公开域名访问：$f 返回 HTTP $CODE"
              exit 1
            fi
          done
          echo "::notice::已镜像到 R2 并通过可达性自检: ${CDN_PUBLIC_URL:-https://cdn.lyb.pub}/${PREFIX}/app-release.apk"
