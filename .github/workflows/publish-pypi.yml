name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm@11 要求 node >=22.13，与 deploy/Dockerfile 的 node:22-alpine 保持一致
          node-version: '22'

      - name: Install pnpm
        # 固定版本：pnpm 12.0.0 曾短暂占据 latest 并默认启用 supply-chain 检查导致构建失败
        run: npm install -g pnpm@11.24.0

      - name: Build Web UI
        run: |
          # Workspace 模式：根目录 pnpm install 自动链接 packages/shared 到 web 的 node_modules
          pnpm install --frozen-lockfile
          cd web
          npm run build
          cp -r out ../ethan/web_dist
          cd ..
          cp -r docs ethan/docs
          # Remove generated dirs from .gitignore so hatchling scans them
          sed -i '/ethan\/web_dist\//d' .gitignore
          sed -i '/ethan\/web_dist/d' .gitignore
          sed -i '/ethan\/docs\//d' .gitignore
          sed -i '/ethan\/docs/d' .gitignore

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Build
        run: uv build --wheel

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
