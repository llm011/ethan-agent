# SearXNG 配置 —— 为 ethan web_search 工具启用 JSON 输出。
# 完整选项见 https://docs.searxng.org/admin/settings/
#
# 引擎测试结果（2026-08-07 代理模式实测）：
#   通用搜索稳定: google(30) > swisscows(30) > google cse(20) > yandex(15) > naver(15) > bing(10) > dogpile(8)
#   仅中文: quark(10)
#   新闻稳定: yahoo news(20+) > chinaso news(20) > bing news(10, 偶尔解析失败)
#   IT 稳定: github, stackoverflow, mdn, docker hub
#   科学稳定: arxiv, google scholar, semantic scholar, core.ac.uk, springer nature, pubmed
#   不可用: yahoo(协议错误), qwant(CAPTCHA), mojeek(403), brave(403), presearch(超时), yep(403)
use_default_settings: true

server:
  secret_key: "please-change-this-searxng-secret-key"
  limiter: false

search:
  default_lang: zh-CN
  formats:
    - html
    - json

outgoing:
  request_timeout: 12.0
  max_request_timeout: 20.0

engines:
  # ════════════════════════════════════════════════════════════════════════════
  # 通用搜索（general）—— 多引擎冗余，避免少数 suspended 就全军覆没
  # ════════════════════════════════════════════════════════════════════════════
  - name: bing
    disabled: false
  - name: google
    disabled: true          # 代理模式由 wrapper 放开
  - name: google cse
    disabled: true
  - name: yandex
    disabled: true
  - name: naver
    disabled: true
  - name: swisscows
    disabled: true
  - name: dogpile
    disabled: true
  - name: quark
    disabled: false         # 夸克：国内直连，仅中文有效

  # ════════════════════════════════════════════════════════════════════════════
  # 新闻（news）
  # ════════════════════════════════════════════════════════════════════════════
  - name: bing news
    disabled: true
  - name: yahoo news
    disabled: true
  - name: chinaso news
    disabled: false         # 中国搜索新闻：国内直连
  - name: wikinews
    disabled: true

  # ════════════════════════════════════════════════════════════════════════════
  # IT / 代码
  # ════════════════════════════════════════════════════════════════════════════
  - name: github
    disabled: true
  - name: stackoverflow
    disabled: true
  - name: mdn
    disabled: true
  - name: docker hub
    disabled: true
  - name: askubuntu
    disabled: true
  - name: superuser
    disabled: true
  - name: pypi
    disabled: true

  # ════════════════════════════════════════════════════════════════════════════
  # 科学 / 学术
  # ════════════════════════════════════════════════════════════════════════════
  - name: arxiv
    disabled: true
  - name: pubmed
    disabled: true
  - name: google scholar
    disabled: true
  - name: semantic scholar
    disabled: true
  - name: core.ac.uk
    disabled: true
  - name: springer nature
    disabled: true

  # ════════════════════════════════════════════════════════════════════════════
  # 直连模式禁用（代理模式由 wrapper 放开）
  # ════════════════════════════════════════════════════════════════════════════
  - name: wikipedia
    disabled: true
  - name: lingva
    disabled: true

  # ════════════════════════════════════════════════════════════════════════════
  # 已知不可用 / 质量差 —— 始终禁用
  # ════════════════════════════════════════════════════════════════════════════
  - name: brave
    disabled: true
  - name: brave.images
    disabled: true
  - name: brave.videos
    disabled: true
  - name: brave.news
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: duckduckgo images
    disabled: true
  - name: duckduckgo news
    disabled: true
  - name: duckduckgo videos
    disabled: true
  - name: startpage
    disabled: true
  - name: startpage images
    disabled: true
  - name: startpage news
    disabled: true
  - name: google news
    disabled: true
  - name: baidu
    disabled: true
  - name: qwant
    disabled: true
  - name: qwant news
    disabled: true
  - name: mojeek
    disabled: true
  - name: yahoo
    disabled: true
  - name: presearch
    disabled: true
  - name: yep
    disabled: true
  - name: vimeo
    disabled: true
  - name: openairedatasets
    disabled: true
  - name: openstreetmap
    disabled: true
  - name: wikidata
    disabled: true
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true
  - name: wikicommons.files
    disabled: true
  - name: wikicommons.images
    disabled: true
  - name: wikicommons.audio
    disabled: true
  - name: wikicommons.videos
    disabled: true
  - name: wiktionary
    disabled: true
