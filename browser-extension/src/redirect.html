<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在打开 Ethan…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh;
    background: #faf9f6; color: #3a3a3a;
  }
  .card {
    text-align: center; padding: 48px 40px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    max-width: 380px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #eee; border-top-color: #e8a838;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .hint { font-size: 13px; color: #999; line-height: 1.6; }
  .hint a { color: #e8a838; text-decoration: none; }
  .hint a:hover { text-decoration: underline; }
  .done .spinner { display: none; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner"></div>
  <h1 id="title">正在打开 Ethan Desktop…</h1>
  <p class="hint" id="hint">
    如果没有自动打开，<a href="#" id="fallback-link">点击这里在浏览器中查看</a>
  </p>
</div>
<script>
// 从 URL 参数读取 deeplink（ethan://chat/xxx）和 fallback（http://host/chat/xxx）
const params = new URLSearchParams(location.search);
const deeplink = params.get('deeplink') || '';
const fallback = params.get('fallback') || '';

const card = document.getElementById('card');
const title = document.getElementById('title');
const hint = document.getElementById('hint');
const fallbackLink = document.getElementById('fallback-link');

if (fallback) fallbackLink.href = fallback;
else fallbackLink.style.display = 'none';

let invoked = false;

// 监听页面可见性变化：如果页面被隐藏，说明桌面端被成功唤起
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    invoked = true;
    card.classList.add('done');
    title.textContent = '已打开 Ethan Desktop';
    hint.textContent = '本页面可以安全关闭。';
  } else if (invoked) {
    // 从桌面端切回来，说明确实唤起成功
    hint.textContent = '本页面可以安全关闭。';
  }
});

// 尝试唤起桌面端
if (deeplink) {
  location.href = deeplink;
}

// 2 秒后如果还没被唤起（页面仍可见），自动跳转到 Web UI
setTimeout(() => {
  if (!invoked && !document.hidden && fallback) {
    location.href = fallback;
  }
}, 2000);
</script>
</body>
</html>
