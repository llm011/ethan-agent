<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ethan Browser</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, system-ui, "PingFang SC", sans-serif;
        width: 300px;
        margin: 0;
        padding: 16px;
        background: #fff;
        color: #1f2430;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1f26; color: #e6e8ec; }
        input { background: #2a2e37; color: #e6e8ec; border-color: #3a3f4a !important; }
        .hint { color: #8b909a !important; }
      }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      header img { width: 28px; height: 28px; border-radius: 6px; }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      .status {
        display: flex; align-items: center; gap: 8px;
        font-size: 13px; padding: 8px 10px; border-radius: 8px;
        background: rgba(127,127,127,0.1); margin-bottom: 14px;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #c0c4cc; flex: none; }
      .dot.on { background: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.18); }
      .dot.off { background: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.15); }
      label { display: block; margin: 12px 0 4px; font-size: 12px; font-weight: 500; }
      input {
        width: 100%; padding: 8px 10px; font-size: 13px;
        border: 1px solid #d6d9e0; border-radius: 7px; background: #fff;
      }
      .hint { font-size: 11px; color: #9aa0aa; margin-top: 3px; }
      .row { display: flex; gap: 8px; margin-top: 16px; }
      button {
        flex: 1; padding: 9px; border: 0; border-radius: 7px;
        font-size: 13px; font-weight: 500; cursor: pointer;
      }
      #connect { background: #4f46e5; color: #fff; }
      #connect:hover { background: #4338ca; }
      #reading { background: #0d9488; color: #fff; }
      #reading:hover { background: #0f766e; }
      #hint { font-size: 12px; color: #9aa0aa; min-height: 16px; margin-top: 8px; text-align: center; transition: color 0.15s; }
      #hint.ok { color: #16a34a; }
      #hint.err { color: #dc2626; }
      #hint.warn { color: #b45309; }
      .toggle-row {
        display: flex; align-items: center; justify-content: space-between;
        margin-top: 14px; padding: 10px 12px; border-radius: 8px;
        background: rgba(127,127,127,0.08);
      }
      .toggle-row .label { font-size: 13px; font-weight: 500; }
      .toggle-row .desc { font-size: 11px; color: #9aa0aa; margin-top: 2px; }
      .switch { position: relative; width: 38px; height: 22px; flex: none; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; inset: 0; cursor: pointer;
        background: #c0c4cc; border-radius: 22px; transition: 0.2s;
      }
      .slider::before {
        content: ''; position: absolute; width: 16px; height: 16px;
        left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s;
      }
      .switch input:checked + .slider { background: #4f46e5; }
      .switch input:checked + .slider::before { transform: translateX(16px); }
      .cmd-section { margin-top: 20px; padding-top: 6px; }
      .cmd-title {
        font-size: 12px; font-weight: 600; letter-spacing: 0.3px;
        color: #8b909a; margin-bottom: 10px;
        display: flex; align-items: center; justify-content: space-between;
      }
      .cmd-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .cmd-btn {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 4px;
        padding: 10px 6px 12px;
        min-height: 76px;
        border-radius: 14px; cursor: pointer;
        font-size: 12px; font-weight: 500; line-height: 1.35; text-align: center;
        border: 1px solid #eceef3; background: #f7f8fb; color: #1f2430;
        box-shadow: 0 1px 2px rgba(17, 24, 39, 0.03);
        transition: background 0.15s, border-color 0.15s, transform 0.08s, box-shadow 0.15s;
      }
      .cmd-btn:hover {
        background: #eef1f8;
        border-color: #d7dbe5;
        box-shadow: 0 3px 8px rgba(17, 24, 39, 0.06);
      }
      .cmd-btn:active { transform: translateY(1px); }
      .cmd-btn .cmd-icon {
        font-size: 20px; line-height: 1;
      }
      @media (prefers-color-scheme: dark) {
        .cmd-btn {
          background: #262a33; border-color: #323744; color: #e6e8ec;
          box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .cmd-btn:hover { background: #2f343f; border-color: #3d4350; }
      }
    </style>
  </head>
  <body>
    <header>
      <img id="logo" src="icons/icon-48.png" alt="" />
      <h1>Ethan Browser</h1>
    </header>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">检查连接中…</span>
    </div>

    <label>Ethan Server WebSocket 地址</label>
    <input id="serverUrl" placeholder="ws://localhost:8900/ws/browser" />
    <div class="hint">同机部署默认 ws://localhost:8900/ws/browser</div>

    <label>Token</label>
    <input id="token" type="password" placeholder="ethan web token" />
    <div class="hint">与 ethan 的 web token 一致（输入即自动保存）</div>

    <label>本端名称</label>
    <input id="clientName" placeholder="如 work-laptop / home-mac" />
    <div class="hint">多浏览器时用于区分，留空则服务端自动分配</div>

    <div class="row">
      <button id="connect">测试连接</button>
      <button id="reading">辅助阅读当前页</button>
    </div>
    <div id="hint"></div>

    <div class="cmd-section">
      <div class="cmd-title">
        <span>页面指令</span>
        <a id="manageCommands" href="#" style="font-weight:400;color:#0d9488;text-decoration:none">管理</a>
      </div>
      <div id="commandList" class="cmd-list"></div>
    </div>

    <div class="toggle-row">
      <div>
        <div class="label">Cookie 弹窗自动关闭</div>
        <div class="desc">Ethan 会话的标签页加载完成时自动拒绝 cookie</div>
      </div>
      <label class="switch">
        <input id="autoCloseCookies" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
